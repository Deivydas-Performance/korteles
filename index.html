<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Suvalkas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<title>Suvalkas</title>
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>
<header>
  <h1>Suvalkas</h1>
  <input id="search" type="search" placeholder="Ieškoti…" autocomplete="off" aria-label="Ieškoti kortelių">
</header>

<main id="list" class="grid"></main>
<p id="empty" class="empty" hidden>Kortelių dar nėra. Spausk <b>+</b> ir pridėk pirmą.</p>

<button id="add" class="fab" aria-label="Pridėti kortelę">+</button>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<!-- Kortelės peržiūra -->
<dialog id="view" aria-labelledby="viewName">
  <div class="sheet sheet--view" id="viewCard">
    <button class="btn dialog__close" id="viewClose" aria-label="Uždaryti">×</button>
    <h2 id="viewName"></h2>
    <div class="code-box"><canvas id="viewBarcode" role="img"></canvas><div id="viewQr"></div></div>
    <div class="code-text" id="viewCode"></div>
    <p class="hint" id="viewHint">Jei nenuskaito, padidink ekrano ryškumą.</p>
    <p class="notes" id="viewNotes"></p>
    <div class="btn-row">
      <button class="btn" id="viewEdit">Redaguoti</button>
      <button class="btn btn--danger" id="viewDelete">Ištrinti</button>
    </div>
  </div>
</dialog>

<!-- Pridėjimas / redagavimas -->
<dialog id="edit" aria-labelledby="editTitle">
  <form id="form" class="sheet" method="dialog">
    <h2 id="editTitle">Nauja kortelė</h2>
    <div class="btn-row">
      <button type="button" class="btn" id="scan">🖼 Iš nuotraukos</button>
      <button type="button" class="btn" id="scanCam">📷 Fotografuoti</button>
    </div>
    <input type="file" id="scanFile" accept="image/*" hidden>
    <input type="file" id="scanCamFile" accept="image/*" capture="environment" hidden>
    <p id="scanMsg" class="scan-msg" role="status" aria-live="polite"></p>

    <label class="field">Pavadinimas<input name="name" required maxlength="40" placeholder="pvz. Maxima"></label>
    <label class="field">Kodas<input name="code" required inputmode="text" autocomplete="off" placeholder="skaičiai iš kortelės"></label>
    <label class="field">Tipas
      <select name="format">
        <option value="auto">Automatiškai</option>
        <option value="CODE128">Brūkšninis (Code 128)</option>
        <option value="EAN13">EAN-13</option>
        <option value="EAN8">EAN-8</option>
        <option value="UPC">UPC-A</option>
        <option value="CODE39">Code 39</option>
        <option value="QR">QR kodas</option>
      </select>
    </label>
    <div class="field" role="group" aria-label="Spalva">Spalva
      <div class="swatches" id="swatches"></div>
      <input type="hidden" name="color" value="#2563eb">
    </div>
    <label class="field">Pastabos<textarea name="notes" rows="2" maxlength="200" placeholder="nuolaida, galiojimas…"></textarea></label>
    <div class="btn-row">
      <button type="button" class="btn" id="editCancel">Atšaukti</button>
      <button type="submit" class="btn btn--primary">Išsaugoti</button>
    </div>
    <div class="btn-row">
      <button type="button" class="btn btn--sm" id="export">Eksportuoti</button>
      <button type="button" class="btn btn--sm" id="import">Importuoti</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </form>
</dialog>


<script src="lib/JsBarcode.all.min.js"></script>
<script src="lib/qrcode.min.js"></script>
<script src="lib/zxing.min.js"></script>
<script src="app.js?v=9"></script>
</body>
</html>
